name: Publish Hot Fix

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: CDP-build-hotfix-workflow
    runs-on: ubuntu-latest
    permissions:
      contents: write # Create the release tag.
      id-token: write # Authenticate to AWS using OIDC.
    env:
      AWS_REGION: eu-west-2
      AWS_ACCOUNT_ID: "094954420758"
    steps:
      - name: Check out code
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          fetch-depth: 0 # Depth 0 required for branch-based versioning
      - name: Publish Hot Fix
        uses: DEFRA/cdp-build-action/build-hotfix@dfb527d1bca7591fbbfd32ac007557745e888cf2 # main
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
